<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pokedex">

    <h1>POKÉDEX</h1>

    <input 
        type="number" 
        id="numero" 
        placeholder="Digite o número">

    <button onclick="callAPI()">
        Buscar
    </button>

    <div class="tela">
        <img id="imagem" alt="">
        <h2 id="nome"></h2>
        <p id="tipo"></p>
    </div>

    <button onclick="mostrarShiny()" class="shiny">
        Mostrar Shiny ✨
    </button>

</div>

<script src="index.js"></script>

</body>
</html>
